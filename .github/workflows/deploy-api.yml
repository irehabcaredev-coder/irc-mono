name: deploy-api
# Untested until the GCP VM (Phase 2) exists. Required repo secrets/vars:
#   secrets: GCP_SA_KEY, VM_HOST, VM_USER, VM_SSH_KEY
#   vars:    GCP_PROJECT, GCP_REGION (asia-south1)
on:
  push:
    branches: [prod]
    paths: ["apps/api/**", "pnpm-lock.yaml", "infra/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ecareplus/api
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: |
          docker build -f apps/api/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Sync infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: infra/docker-compose.yml,infra/caddy,infra/livekit
          target: /opt/ecareplus
          strip_components: 1
      - name: Roll out
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/ecareplus
            sed -i "s|^API_IMAGE=.*|API_IMAGE=$IMAGE:${{ github.sha }}|" .env
            gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
            docker compose pull api
            docker compose --profile tools run --rm migrate
            docker compose up -d
            docker image prune -f
