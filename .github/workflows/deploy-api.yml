name: deploy-api
# Untested until the GCP VM (Phase 2) exists. Required repo secrets/vars:
#   secrets: GCP_SA_KEY, VM_HOST, VM_USER, VM_SSH_KEY
#   vars:    GCP_PROJECT, GCP_REGION (asia-south1)
on:
  push:
    branches: [prod]
    paths: ["apps/api/**", "pnpm-lock.yaml", "infra/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ecareplus/api
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/244360128721/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@ecareplus-prod-41234.iam.gserviceaccount.com'
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: |
          docker build -f apps/api/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Ensure target directory exists on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || vars.VM_HOST }}
          username: ${{ secrets.VM_USER || vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY || vars.VM_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/ecareplus
            sudo chown -R $USER:$USER /opt/ecareplus
      - name: Sync infra files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST || vars.VM_HOST }}
          username: ${{ secrets.VM_USER || vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY || vars.VM_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/caddy/**"
          target: /opt/ecareplus
          strip_components: 1
      - name: Write .env on VM if provided in secrets
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || vars.ENV_FILE }}
        with:
          host: ${{ secrets.VM_HOST || vars.VM_HOST }}
          username: ${{ secrets.VM_USER || vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY || vars.VM_SSH_KEY }}
          envs: ENV_CONTENT
          script: |
            if [ -n "$ENV_CONTENT" ]; then
              mkdir -p /opt/ecareplus
              printf "%s\n" "$ENV_CONTENT" > /opt/ecareplus/.env
            fi
      - name: Roll out
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST || vars.VM_HOST }}
          username: ${{ secrets.VM_USER || vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY || vars.VM_SSH_KEY }}
          script: |
            cd /opt/ecareplus
            touch .env
            if grep -q "^API_IMAGE=" .env; then
              sed -i "s|^API_IMAGE=.*|API_IMAGE=$IMAGE:${{ github.sha }}|" .env
            else
              echo "API_IMAGE=$IMAGE:${{ github.sha }}" >> .env
            fi
            gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
            docker compose pull api
            docker compose --profile tools run --rm migrate
            docker compose up -d
            docker image prune -f
