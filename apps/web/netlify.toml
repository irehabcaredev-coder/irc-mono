[build]
  # Web only. The root "build" script also compiles the API, which needs `prisma generate` and is deployed by its own workflow.
  command = "pnpm --filter ./apps/web build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BASE_ENDPOINT"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"