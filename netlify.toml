[build]
  command = "npm run build && mkdir -p public/_next/static && cp -r .next/static/* public/_next/static/"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BASE_ENDPOINT"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"