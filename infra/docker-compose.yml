# Production stack for the GCP VM. Run from this directory:
#   docker compose --env-file .env up -d
services:
  api:
    image: ${API_IMAGE:?set API_IMAGE, e.g. asia-south1-docker.pkg.dev/<project>/ecareplus/api:<tag>}
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off:  docker compose --profile tools run --rm migrate
  migrate:
    image: ${API_IMAGE}
    profiles: ["tools"]
    env_file: .env
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
