# API key/secret are supplied via the LIVEKIT_KEYS env var (see docker-compose.yml),
# so no secrets live in this file.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  # UDP TURN only. TLS TURN (5349/443) needs a cert and is deferred.
  enabled: true
  udp_port: 3478
logging:
  level: info
